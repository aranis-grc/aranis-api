# The Verify stage of aranis-api-pipeline (aranis-infra verify-pipelines/,
# modules/verify-pipeline). Runs ci/verify.sh on the pushed commit; there is no
# build or deploy behind it (SCRUM-957).
version: 0.2

env:
  shell: bash

phases:
  install:
    runtime-versions:
      # 22, the runtime of the standard:8.0 image.
      nodejs: 22
    commands:
      - |
        GITLEAKS_VERSION=8.30.1
        base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
        tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
        cd /tmp
        curl -sSfL "${base}/${tarball}" -o "${tarball}"
        curl -sSfL "${base}/gitleaks_${GITLEAKS_VERSION}_checksums.txt" -o checksums.txt
        grep " ${tarball}\$" checksums.txt | sha256sum -c -
        tar -xzf "${tarball}" gitleaks && install -m 0755 gitleaks /usr/local/bin/gitleaks
        cd - >/dev/null
        gitleaks version
  pre_build:
    commands:
      - npm ci --no-audit --no-fund
  build:
    commands:
      - bash ci/verify.sh
