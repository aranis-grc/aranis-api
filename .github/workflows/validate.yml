name: validate

on:
  push:
    branches: [main]
  # Lets the documentation site be rebuilt without inventing a contract change —
  # useful after fixing the deploy hook, or to recover a site build that failed for an
  # unrelated reason.
  workflow_dispatch:
  pull_request:

jobs:
  # ONE of the four shared jobs, and the three omissions are deliberate.
  #
  # There is no package.json here: this repository is the published API contract —
  # an OpenAPI document and a Postman collection — not an application. typecheck,
  # lint and audit have nothing to read, and switching them on would produce a job
  # that fails for the honest reason that it does not apply.
  #
  # The secret scan does apply, and applies especially: this is the repository whose
  # whole purpose is to be read by people outside the company.
  standard:
    name: Standard
    uses: aranis-grc/.github/.github/workflows/standard-ci.yml@main
    secrets: inherit
    with:
      typecheck: false
      lint: false
      audit: false

  spec:
    name: OpenAPI contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Lint the specification
        run: npx --yes @redocly/cli@latest lint openapi.yaml

      # The collection is generated from the spec. If it stops matching, an integrator
      # imports a collection that describes an API we do not serve.
      - name: Postman collection covers every operation
        run: |
          npm install --no-save js-yaml
          node -e "
            const yaml = require('js-yaml')
            const fs   = require('fs')
            const spec = yaml.load(fs.readFileSync('openapi.yaml', 'utf8'))
            const col  = JSON.parse(fs.readFileSync('postman/aranis-api.postman_collection.json', 'utf8'))

            const METHODS = ['get', 'post', 'put', 'patch', 'delete']
            const ops = Object.entries(spec.paths).flatMap(([p, item]) =>
              Object.keys(item).filter(m => METHODS.includes(m)).map(m => m.toUpperCase() + ' ' + p))
            const reqs = col.item.flatMap(f => f.item)

            if (reqs.length !== ops.length) {
              console.error('collection has ' + reqs.length + ' requests, spec has ' + ops.length + ' operations')
              console.error('run: npx tsx scripts/generate-postman-collection.ts in the SaaS repo, then re-sync')
              process.exit(1)
            }

            // Auth must stay on the collection. Per-request auth is how a collection ends
            // up with a real key pasted into one request and committed.
            if (col.auth?.type !== 'bearer' || col.auth.bearer[0].value !== '{{apiKey}}') {
              console.error('collection auth must be bearer {{apiKey}} at the collection level')
              process.exit(1)
            }

            // A committed collection must never carry a real credential.
            const raw = fs.readFileSync('postman/aranis-api.postman_collection.json', 'utf8')
            if (/ara_live_[A-Za-z0-9]{10,}/.test(raw)) {
              console.error('collection contains what looks like a real API key')
              process.exit(1)
            }

            console.log('collection covers all ' + ops.length + ' operations')
          "

  sdk:
    name: TypeScript SDK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk/typescript
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install

      # Regenerating must be a no-op. A diff here means the spec moved and the SDK's
      # types did not — exactly the drift this repository exists to prevent.
      - name: Generated types are up to date with the spec
        run: |
          npm run generate
          git diff --exit-code src/generated.ts \
            || (echo "src/generated.ts is stale — run 'npm run generate' and commit"; exit 1)

      - run: npm run typecheck
      - run: npm run build

  publish-docs:
    name: Rebuild developers.aranis.ai
    # Only after the contract has been validated, and only on main — a broken spec must
    # not reach the documentation site.
    needs: [spec, sdk]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Did the contract itself change?
        id: changed
        run: |
          # A manual run is an explicit request to republish, so it skips the check.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "touched=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git diff --name-only HEAD^ HEAD \
               | grep -qE '^(openapi\.yaml|postman/)'; then
            echo "touched=true" >> "$GITHUB_OUTPUT"
          else
            echo "touched=false" >> "$GITHUB_OUTPUT"
          fi

      # The site has no committed copy of the contract — it fetches this repository at
      # build time — so a rebuild is what publishes a contract change.
      - name: Trigger the Vercel build
        if: steps.changed.outputs.touched == 'true'
        run: |
          if [ -z "${{ secrets.VERCEL_DEPLOY_HOOK_URL }}" ]; then
            echo "::warning::VERCEL_DEPLOY_HOOK_URL is not set — developers.aranis.ai will keep serving the previous contract until it is rebuilt by hand."
            exit 0
          fi
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST "${{ secrets.VERCEL_DEPLOY_HOOK_URL }}")
          if [ "$code" != "200" ] && [ "$code" != "201" ]; then
            echo "::error::Deploy hook returned HTTP $code"
            exit 1
          fi
          echo "developers.aranis.ai rebuild triggered."
