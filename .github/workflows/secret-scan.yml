name: Secret Scan (Gitleaks)

# A COPY, DELIBERATELY, AND HERE IS THE ONLY REASON IT IS ONE.
#
# Every other repository in the organization calls the single source at
# aranis-grc/.github/.github/workflows/standard-ci.yml. This one cannot: it is
# PUBLIC — it exists to be read by integrators outside the company — and a public
# repository may not call a reusable workflow that lives in a private one. The
# attempt fails at file resolution: zero jobs, no logs, and a run that reports only
# "this run likely failed because of a workflow file issue".
#
# So this file is the exception, and it is written down instead of being discovered.
# It is a copy of the `secret-scan` job of the shared workflow, and NOTHING ELSE from
# the standard applies here: there is no package.json, so type check, lint and the
# dependency audit have nothing to read.
#
# KEEPING IT IN SYNC: when the shared secret-scan job changes, this changes too. It
# will not happen by itself, and no guard checks it — that is the price of the copy,
# and the reason the copy was chosen only where the platform left no alternative.
# It goes away the day the shared workflow becomes public, or this repository private.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  secret-scan:
    name: Detect secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The binary, not gitleaks/gitleaks-action: the Action refuses to run for an
      # organization without a paid licence. Pinned by version AND checksum, and
      # downloaded under its published name — `sha256sum -c` resolves the filename
      # written inside the checksum line, so renaming the tarball makes verification
      # look for a file that is not there.
      - name: Install Gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          set -euo pipefail
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL "${base}/${tarball}" -o "${tarball}"
          curl -sSfL "${base}/gitleaks_${GITLEAKS_VERSION}_checksums.txt" -o checksums.txt
          grep " ${tarball}\$" checksums.txt | sha256sum -c -
          tar -xzf "${tarball}" gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
          rm -f "${tarball}" checksums.txt gitleaks
          gitleaks version

      # A push scans the range it delivered; anything else scans the whole history.
      # Fails toward scanning MORE: a first push to a new branch and a force-push both
      # report an unresolvable `before`, and both fall back to the full scan. A range
      # that cannot be resolved must never become an empty scan that passes.
      - name: Run Gitleaks
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          set -uo pipefail
          CONFIG=""
          [ -f .gitleaks.toml ] && CONFIG="--config .gitleaks.toml"
          RANGE=""
          if [ "${{ github.event_name }}" = "push" ] \
             && [ -n "${BEFORE:-}" ] \
             && [ "${BEFORE}" != "0000000000000000000000000000000000000000" ] \
             && git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            RANGE="--log-opts=${BEFORE}..${AFTER}"
            echo "::notice::Incremental scan of ${BEFORE:0:8}..${AFTER:0:8}"
          else
            echo "::notice::Full-history scan (no resolvable range for this event)"
          fi
          gitleaks detect ${CONFIG} \
            --report-format json \
            --report-path gitleaks-report.json \
            --redact \
            --log-level info \
            ${RANGE}

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-report-${{ github.run_id }}
          path: gitleaks-report.json
          retention-days: 30
          if-no-files-found: ignore
